services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=["http://localhost:3000"]
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - MODEL_CACHE_DIR=/data/model-cache
    volumes:
      - ./backend:/app
      - model-cache:/data/model-cache
    restart: unless-stopped

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_WS_URL=ws://localhost:8000
    volumes:
      - ./web:/app
    depends_on:
      - backend

volumes:
  model-cache:
